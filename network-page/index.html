<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>占位姓名 · 个人主页</title>
<meta name="description" content="个人介绍主页：技术简介、个人经历、项目与开源仓库。" />

<!-- =========================================================================
     自包含单文件个人主页：结构 + 样式 + 数据都在本文件内。
     由自己的 HTTP 服务器作为静态资源返回即可（GET / → 本文件）。
     日常维护只改文件末尾的 PROFILE 数据对象；空栏目会自动隐藏。
     风格：卡片分区 · 蓝色主色 · 浅色底 · 直角硬朗
     ========================================================================= -->

<style>
  :root {
    color-scheme: light;     /* 锁定浅色，避免手机深色模式自动反色 */
    /* 色彩：浅灰底 + 近黑墨色 + 实心蓝（直角硬朗，不做渐变） */
    --bg:           #f4f6f9;
    --surface:      #ffffff;
    --ink:          #111827;
    --ink-soft:     #374151;
    --muted:        #6b7280;
    --line:         #e5e7eb;
    --line-soft:    #eef1f5;
    --line-strong:  #d1d5db;
    /* 主色：蓝 */
    --blue:         #2563eb;
    --blue-deep:    #1e40af;
    --blue-wash:    #eef4ff;
    /* 标签配色轮换（同色系，避免单调） */
    --indigo:       #4f46e5;
    --indigo-wash:  #eef2ff;
    --cyan-deep:    #0e7490;
    --cyan-wash:    #e6f6fa;

    --shadow: 0 1px 2px rgba(17, 24, 39, .05), 0 4px 14px -8px rgba(17, 24, 39, .14);
    --maxw: 960px;

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code",
            Consolas, "Liberation Mono", monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
            "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
            "Noto Sans SC", sans-serif;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15.5px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overflow-x: hidden;              /* 兜底：避免任何元素撑出横向滚动 */
    -webkit-tap-highlight-color: transparent;   /* 移动端去掉点击灰块 */
  }

  img { max-width: 100%; }

  a { color: var(--blue-deep); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }

  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .wrap {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 44px 24px calc(60px + env(safe-area-inset-bottom, 0px));
  }

  /* ---------------- Hero：直角卡片 ---------------- */
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(250px, 1fr);
    gap: 38px;
    align-items: end;
    padding: 30px 32px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }

  .hero-id { display: flex; align-items: center; gap: 15px; }

  .avatar {
    width: 58px; height: 58px; flex: 0 0 auto;
    display: grid; place-items: center;
    color: #fff;
    font-size: 23px; font-weight: 700;
    background: var(--blue);
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .hero-id .en {
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: .04em;
    color: var(--muted);
  }

  .hero h1 {
    margin: 18px 0 0;
    font-size: clamp(28px, 7vw, 46px);
    line-height: 1.06;
    overflow-wrap: anywhere;
    font-weight: 800;
    letter-spacing: .01em;
  }

  .tagline { margin: 10px 0 0; color: var(--ink-soft); font-size: 16px; }

  .status {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 16px;
    padding: 5px 12px;
    background: var(--blue-wash);
    color: var(--blue-deep);
    font-size: 13px; font-weight: 600;
  }
  .status::before { content: ""; width: 7px; height: 7px; background: var(--blue); }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .btn {
    display: inline-flex; align-items: center;
    padding: 10px 18px;
    font-size: 14px; font-weight: 600;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn:hover { text-decoration: none; border-color: var(--blue); color: var(--blue-deep); background: var(--blue-wash); }
  .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn.primary:hover { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }

  /* 规格表：等宽键 + 右对齐值 */
  .spec {
    margin: 0;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 9px 18px;
    align-self: center;
    padding-left: 28px;
    border-left: 1px solid var(--line);
  }
  .spec dt {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .06em;
    color: var(--muted);
    align-self: center;
    white-space: nowrap;
  }
  .spec dd {
    margin: 0;
    text-align: right;
    font-weight: 600;
    color: var(--ink-soft);
    overflow-wrap: anywhere;
  }

  /* ---------------- 区块卡片 ---------------- */
  section {
    margin-top: 22px;
    padding: 0 26px 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  .sec-head {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 0 13px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .sec-head .node { width: 10px; height: 10px; background: var(--blue); flex: 0 0 auto; }
  .sec-head h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .01em; }
  .sec-head .rule { display: none; }

  /* ---------------- 关于我 ---------------- */
  .prose { max-width: 64ch; }
  .prose p { margin: 0 0 13px; color: var(--ink-soft); }
  .prose p:last-child { margin-bottom: 0; }

  /* ---------------- 技术简介：定义列表 ---------------- */
  .skills { margin: 0; }
  .skill-row {
    display: grid;
    grid-template-columns: 150px minmax(0, 1fr);
    gap: 22px;
    padding: 15px 0;
    border-top: 1px solid var(--line-soft);
    align-items: baseline;
  }
  .skill-row:first-child { border-top: none; padding-top: 0; }
  .skill-row dt {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .05em;
    color: var(--blue-deep);
    font-weight: 600;
  }
  .skill-row .tags { margin: 0; display: flex; flex-wrap: wrap; gap: 7px; }
  .tag {
    padding: 3px 10px;
    font-size: 13px;
    font-weight: 500;
    background: var(--blue-wash);
    color: var(--blue-deep);
  }
  /* 标签按组轮换同色系配色，增加层次 */
  .skill-row.g1 dt { color: var(--indigo); }
  .skill-row.g1 .tag { background: var(--indigo-wash); color: var(--indigo); }
  .skill-row.g2 dt { color: var(--cyan-deep); }
  .skill-row.g2 .tag { background: var(--cyan-wash); color: var(--cyan-deep); }

  /* ---------------- 个人经历：时间线 ---------------- */
  .timeline { display: grid; }
  .tl-item {
    display: grid;
    grid-template-columns: 132px minmax(0, 1fr);
    column-gap: 26px;
    padding-bottom: 24px;
  }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item .when {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    padding-top: 2px;
    white-space: nowrap;
  }
  .tl-body { position: relative; padding-left: 22px; border-left: 1px solid var(--line); }
  .tl-body::before {
    content: "";
    position: absolute; left: -5px; top: 6px;
    width: 9px; height: 9px;
    background: var(--surface);
    border: 2px solid var(--blue);
  }
  .tl-title { font-weight: 700; overflow-wrap: anywhere; }
  .tl-org { color: var(--muted); font-weight: 500; font-size: 13.5px; }
  .tl-desc { margin: 6px 0 0; color: var(--ink-soft); }
  .tl-body .tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 7px; }

  /* ---------------- 项目经历：通栏行 ---------------- */
  .proj { padding: 20px 0; border-top: 1px solid var(--line-soft); }
  .proj:first-child { border-top: none; padding-top: 0; }
  .proj-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .proj-name { font-size: 16px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .proj-name a { color: var(--ink); }
  .proj-name a:hover { color: var(--blue-deep); text-decoration: none; }
  .proj-role { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .proj-role.is-right { margin-left: auto; }
  .proj-desc { margin: 8px 0 0; color: var(--ink-soft); max-width: 68ch; }
  .proj ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); max-width: 68ch; }
  .proj ul li { margin: 3px 0; }
  .proj .foot { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 12px; }
  .proj .tags { display: flex; flex-wrap: wrap; gap: 7px; }
  .link-row { display: flex; flex-wrap: wrap; gap: 18px; }
  .link-row a { font-size: 13.5px; font-weight: 600; color: var(--blue-deep); border-bottom: 1px solid var(--blue); padding-bottom: 1px; }
  .link-row a:hover { text-decoration: none; background: var(--blue-wash); }

  /* ---------------- 开源仓库：紧凑行 ---------------- */
  .repo-grid { display: block; }
  .repo {
    display: flex; align-items: center; justify-content: space-between; gap: 22px;
    padding: 14px 0;
    border-top: 1px solid var(--line-soft);
  }
  .repo:first-child { border-top: none; padding-top: 0; }
  .repo-main { display: block; min-width: 0; }
  .repo-name { display: flex; align-items: center; gap: 8px; font-weight: 650; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
  .repo-dot { width: 8px; height: 8px; background: var(--blue); flex: 0 0 auto; }
  .repo-desc { display: block; margin-top: 5px; font-size: 13.5px; color: var(--muted); }
  .repo-meta {
    flex: 0 0 auto; display: flex; gap: 16px;
    font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap;
  }
  .repo:hover { text-decoration: none; }
  .repo:hover .repo-name { color: var(--blue-deep); }

  /* ---------------- 页脚 ---------------- */
  footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; justify-content: space-between;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
  }
  .foot-links { display: flex; gap: 20px; }

  /* ---------------- 进场：仅 Hero，一次编排 ---------------- */
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .hero > * { animation: rise .5s cubic-bezier(.22, .61, .36, 1) both; }
  .hero > :nth-child(2) { animation-delay: .07s; }

  [data-empty] { display: none !important; }

  /* ---------------- 移动端：平板/大屏手机 ---------------- */
  @media (max-width: 720px) {
    .wrap { padding: 28px 18px calc(52px + env(safe-area-inset-bottom, 0px)); }
    .hero { grid-template-columns: 1fr; gap: 22px; padding: 24px 20px; align-items: stretch; }
    .spec { padding-left: 0; padding-top: 18px; border-left: none; border-top: 1px solid var(--line); }
    .spec dd { text-align: left; }
    section { padding: 0 18px 20px; }
    .skill-row { grid-template-columns: 1fr; gap: 8px; padding: 13px 0; }
    .tl-item { grid-template-columns: 1fr; row-gap: 5px; padding-bottom: 20px; }
    .tl-body { border-left: none; padding-left: 0; }
    .tl-body::before { display: none; }
    /* 项目：日期不再单独右对齐，避免窄屏"飘"到右边 */
    .proj-role.is-right { margin-left: 0; }
    /* 仓库：由横排改为上下堆叠，名称/描述占满整行 */
    .repo { flex-direction: column; align-items: flex-start; gap: 8px; }
    .repo-main { width: 100%; }
    .repo-meta { white-space: normal; }
    footer { justify-content: flex-start; }
  }

  /* ---------------- 移动端：小屏手机 ---------------- */
  @media (max-width: 480px) {
    .wrap { padding: 20px 12px calc(44px + env(safe-area-inset-bottom, 0px)); }
    .hero { padding: 20px 16px; gap: 18px; }
    section { padding: 0 15px 18px; }
    .sec-head { padding: 14px 0 11px; margin-bottom: 16px; }
    /* 按钮等分撑满一行，便于单手点按 */
    .actions { gap: 8px; }
    .btn { flex: 1 1 auto; justify-content: center; padding: 10px 14px; }
    .proj ul { padding-left: 16px; }
    footer { flex-direction: column; align-items: flex-start; gap: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    .hero > * { animation: none; }
  }

  @media print {
    body { background: #fff; }
    .actions, .hero > * { animation: none; }
    .hero, section { box-shadow: none; }
    section { break-inside: avoid; }
  }
</style>
</head>

<div class="wrap">

  <!-- ============================ Hero ============================ -->

  <footer id="footer"></footer>
</div>

<script>

/* =======================================================================
 *  渲染逻辑 —— 一般不需要改动
 * ======================================================================= */
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const isHttp = (u) => /^https?:/i.test(String(u || ""));
  const ext = (u) => (isHttp(u) ? ' target="_blank" rel="noopener"' : "");

  /* Hero */
  $("name").textContent = PROFILE.name || "";
  $("enName").textContent = PROFILE.englishName || "";
  $("tagline").textContent = PROFILE.tagline || "";

  if (PROFILE.avatar) {
    $("avatar").innerHTML = '<img src="' + esc(PROFILE.avatar) + '" alt="' + esc(PROFILE.name) + '">';
  } else {
    $("avatar").textContent = (PROFILE.name || "?").trim().charAt(0);
  }

  if (PROFILE.status) {
    $("statusWrap").innerHTML = '<span class="status">' + esc(PROFILE.status) + "</span>";
  }

  $("actions").innerHTML = (PROFILE.actions || []).map((a) =>
    '<a class="btn' + (a.primary ? " primary" : "") + '" href="' + esc(a.href) + '"' + ext(a.href) + ">" +
    esc(a.label) + "</a>"
  ).join("");

  /* 联系方式规格表 */
  $("spec").innerHTML = (PROFILE.contacts || []).map((c) => {
    const label = c.label || c.type || "";
    const value = c.href
      ? '<a href="' + esc(c.href) + '"' + ext(c.href) + ">" + esc(c.value) + "</a>"
      : esc(c.value);
    return "<dt>" + esc(label) + "</dt><dd>" + value + "</dd>";
  }).join("");

  /* 关于我 */
  $("summary").innerHTML = (PROFILE.summary || []).map((p) => "<p>" + esc(p) + "</p>").join("");

  /* 技术简介（g0/g1/g2 轮换配色） */
  $("skills").innerHTML = (PROFILE.skills || []).map((g, i) =>
    '<div class="skill-row g' + (i % 3) + '"><dt>' + esc(g.group) + '</dt><dd class="tags">' +
    (g.items || []).map((it) => '<span class="tag">' + esc(typeof it === "string" ? it : it.name) + "</span>").join("") +
    "</dd></div>"
  ).join("");

  /* 个人经历 */
  $("timeline").innerHTML = (PROFILE.experiences || []).map((e) =>
    '<div class="tl-item"><div class="when">' + esc(e.period) + '</div><div class="tl-body">' +
    '<div class="tl-title">' + esc(e.title) +
    (e.org ? ' <span class="tl-org">/ ' + esc(e.org) + "</span>" : "") + "</div>" +
    (e.desc ? '<p class="tl-desc">' + esc(e.desc) + "</p>" : "") +
    tags(e.tags) + "</div></div>"
  ).join("");

  /* 项目经历 */
  $("projects").innerHTML = (PROFILE.projects || []).map((p) =>
    '<div class="proj"><div class="proj-top">' +
      '<div class="proj-name">' +
        (p.href ? '<a href="' + esc(p.href) + '"' + ext(p.href) + ">" + esc(p.name) + "</a>" : esc(p.name)) +
      "</div>" +
      (p.role ? '<span class="proj-role">' + esc(p.role) + "</span>" : "") +
      (p.period ? '<span class="proj-role is-right">' + esc(p.period) + "</span>" : "") +
    "</div>" +
    (p.desc ? '<p class="proj-desc">' + esc(p.desc) + "</p>" : "") +
    ((p.highlights || []).length ? "<ul>" + p.highlights.map((h) => "<li>" + esc(h) + "</li>").join("") + "</ul>" : "") +
    '<div class="foot">' + tags(p.tags) + links(p.links) + "</div>" +
    "</div>"
  ).join("");

  /* 开源仓库：紧凑行（左：名称+描述，右：语言/星标） */
  $("repos").innerHTML = (PROFILE.repos || []).map((r) =>
    '<a class="repo" href="' + esc(r.href) + '"' + ext(r.href) + ">" +
      '<span class="repo-main">' +
        '<span class="repo-name"><span class="repo-dot"></span>' + esc(r.name) + "</span>" +
        (r.desc ? '<span class="repo-desc">' + esc(r.desc) + "</span>" : "") +
      "</span>" +
      '<span class="repo-meta">' +
        (r.lang ? "<span>" + esc(r.lang) + "</span>" : "") +
        (r.stars != null ? "<span>★ " + esc(r.stars) + "</span>" : "") +
        (r.forks != null ? "<span>⑂ " + esc(r.forks) + "</span>" : "") +
      "</span></a>"
  ).join("");

  /* 页脚 */
  const f = PROFILE.footer || {};
  $("footer").innerHTML =
    "<span>" + esc(f.text || "") + "</span>" +
    '<span class="foot-links">' +
      (f.csdn ? '<a href="' + esc(f.csdn) + '"' + ext(f.csdn) + ">CSDN</a>" : "") +
      (f.github ? '<a href="' + esc(f.github) + '"' + ext(f.github) + ">GitHub</a>" : "") +
    "</span>";

  /* 小工具 */
  function tags(list) {
    return (list || []).length
      ? '<div class="tags">' + list.map((t) => '<span class="tag">' + esc(t) + "</span>").join("") + "</div>"
      : "";
  }
  function links(list) {
    return (list || []).length
      ? '<div class="link-row">' + list.map((l) =>
          '<a href="' + esc(l.href) + '"' + ext(l.href) + ">" + esc(l.label) + "</a>"
        ).join("") + "</div>"
      : "";
  }

  /* 自动隐藏空栏目 */
  const visible = [
    ["sec-about", (PROFILE.summary || []).length],
    ["sec-skills", (PROFILE.skills || []).length],
    ["sec-exp", (PROFILE.experiences || []).length],
    ["sec-projects", (PROFILE.projects || []).length],
    ["sec-repos", (PROFILE.repos || []).length]
  ];
  visible.forEach(([id, n]) => { if (!n) $(id).setAttribute("data-empty", ""); });
})();
</script>
</body>
</html>
