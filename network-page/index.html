<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>个人主页 · 占位姓名</title>
<meta name="description" content="个人介绍主页：技术简介、个人经历、项目与开源仓库。" />

<!-- =========================================================
     说明（可删）：
     这是一个「自包含」的单文件个人主页，CSS/JS/数据都在本文件内。
     HTTP 服务器只需把本文件（或 www 目录）作为静态资源返回即可。
     日常维护只需要修改文件末尾 PROFILE 对象里的内容。
     扩展方式见文件末尾注释。
     ========================================================= -->

<style>
  :root {
    --bg: #f6fbf9;
    --surface: #ffffff;
    --text: #1f2a37;
    --muted: #64748b;
    --border: #e6efeb;
    --accent: #14b8a6;
    --accent-soft: #e6f7f4;
    --accent-deep: #0f8a7e;
    --shadow: 0 1px 2px rgba(16, 74, 66, .04), 0 8px 24px rgba(16, 74, 66, .06);
    --radius: 16px;
    --maxw: 920px;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background:
      radial-gradient(1200px 500px at 50% -220px, #d9f5ef 0%, rgba(217, 245, 239, 0) 70%),
      var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent-deep); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 48px 20px 64px; }

  /* ---------- Hero ---------- */
  .hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 36px 32px;
    display: flex;
    gap: 26px;
    align-items: center;
    flex-wrap: wrap;
  }

  .avatar {
    width: 96px; height: 96px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--accent) 0%, var(--accent-deep) 100%);
    color: #fff;
    display: grid; place-items: center;
    font-size: 34px; font-weight: 700; letter-spacing: 1px;
    box-shadow: 0 10px 24px rgba(20, 184, 166, .28);
  }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }

  .hero-main { flex: 1 1 320px; min-width: 260px; }
  .hero h1 { margin: 0; font-size: 30px; letter-spacing: .5px; }
  .hero .en { color: var(--muted); font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
  .hero .tagline { margin: 10px 0 0; color: #334155; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 12px;
    background: var(--accent-soft);
    color: var(--accent-deep);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 13px; font-weight: 600;
  }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    padding: 9px 16px;
    font-size: 14px; font-weight: 600;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    box-shadow: 0 6px 16px rgba(20, 184, 166, .25);
  }
  .btn:hover { text-decoration: none; transform: translateY(-1px); background: var(--accent-deep); }
  .btn.ghost {
    background: #fff; color: var(--accent-deep);
    border: 1px solid var(--border); box-shadow: none;
  }
  .btn.ghost:hover { background: var(--accent-soft); }

  /* ---------- Sections ---------- */
  section { margin-top: 34px; }
  .sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .sec-head h2 { font-size: 18px; margin: 0; letter-spacing: .5px; }
  .sec-head .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--accent); }
  .sec-head .line { flex: 1; height: 1px; background: var(--border); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
  }

  .summary { color: #334155; }
  .summary p { margin: 0 0 10px; }
  .summary p:last-child { margin-bottom: 0; }

  /* ---------- Contact ---------- */
  .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .contact-item { display: flex; gap: 12px; align-items: flex-start; }
  .contact-item .ico {
    width: 38px; height: 38px; flex: 0 0 auto;
    border-radius: 10px; background: var(--accent-soft); color: var(--accent-deep);
    display: grid; place-items: center; font-size: 17px;
  }
  .contact-item .k { font-size: 12px; color: var(--muted); letter-spacing: .5px; }
  .contact-item .v { font-weight: 600; word-break: break-all; }

  /* ---------- Skills ---------- */
  .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .skill-group h3 { margin: 0 0 10px; font-size: 14px; color: var(--accent-deep); letter-spacing: .5px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    background: var(--accent-soft); color: var(--accent-deep);
    border-radius: 8px; padding: 4px 11px;
    font-size: 13px; font-weight: 500;
  }
  .tag.plain { background: #f1f5f9; color: #475569; }

  /* ---------- Timeline ---------- */
  .timeline { position: relative; padding-left: 26px; }
  .timeline::before {
    content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px;
    width: 2px; background: var(--border);
  }
  .tl-item { position: relative; padding-bottom: 22px; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item::before {
    content: ""; position: absolute; left: -26px; top: 6px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; border: 3px solid var(--accent);
  }
  .tl-period { font-size: 13px; color: var(--muted); letter-spacing: .4px; }
  .tl-title { font-weight: 700; margin: 2px 0 4px; }
  .tl-title .org { color: var(--muted); font-weight: 500; }
  .tl-desc { color: #334155; margin: 0 0 8px; }

  /* ---------- Grid cards (projects / repos) ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .item { display: flex; flex-direction: column; gap: 8px; transition: transform .15s ease, box-shadow .15s ease; }
  .item:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(16, 74, 66, .10); }
  .item-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .item-title { font-weight: 700; }
  .item-title a { color: var(--text); }
  .item-title a:hover { color: var(--accent-deep); }
  .item-role { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .item-desc { color: #475569; font-size: 14px; margin: 0; }
  .item ul { margin: 0; padding-left: 18px; color: #475569; font-size: 14px; }
  .item ul li { margin: 2px 0; }
  .item .meta { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); align-items: center; flex-wrap: wrap; }
  .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
  .links a { font-size: 13px; font-weight: 600; }

  footer { margin-top: 48px; text-align: center; color: var(--muted); font-size: 13px; }
  footer .sep { margin: 0 8px; opacity: .5; }

  [data-empty] { display: none !important; }

  @media (max-width: 560px) {
    .wrap { padding: 28px 16px 48px; }
    .hero { padding: 26px 20px; }
    .hero h1 { font-size: 25px; }
  }
</style>
</head>

<body>
<div class="wrap">

  <!-- ===================== Hero ===================== -->
  <header class="hero">
    <div class="avatar" id="avatar">占</div>
    <div class="hero-main">
      <h1 id="name">占位姓名</h1>
      <div class="en" id="enName"></div>
      <p class="tagline" id="tagline"></p>
      <span class="badge" id="status"></span>
      <div class="actions" id="actions"></div>
    </div>
  </header>

  <!-- ===================== 关于我 ===================== -->
  <section id="sec-about">
    <div class="sec-head"><span class="dot"></span><h2>关于我</h2><span class="line"></span></div>
    <div class="card summary" id="summary"></div>
  </section>

  <!-- ===================== 联系方式 ===================== -->
  <section id="sec-contact">
    <div class="sec-head"><span class="dot"></span><h2>联系方式</h2><span class="line"></span></div>
    <div class="card contact-grid" id="contacts"></div>
  </section>

  <!-- ===================== 技术简介 ===================== -->
  <section id="sec-skills">
    <div class="sec-head"><span class="dot"></span><h2>技术简介</h2><span class="line"></span></div>
    <div class="skills" id="skills"></div>
  </section>

  <!-- ===================== 个人经历 ===================== -->
  <section id="sec-exp">
    <div class="sec-head"><span class="dot"></span><h2>个人经历</h2><span class="line"></span></div>
    <div class="card"><div class="timeline" id="timeline"></div></div>
  </section>

  <!-- ===================== 项目经历 ===================== -->
  <section id="sec-projects">
    <div class="sec-head"><span class="dot"></span><h2>项目经历</h2><span class="line"></span></div>
    <div class="grid" id="projects"></div>
  </section>

  <!-- ===================== 开源仓库 ===================== -->
  <section id="sec-repos">
    <div class="sec-head"><span class="dot"></span><h2>开源仓库</h2><span class="line"></span></div>
    <div class="grid" id="repos"></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
/* =====================================================================
 *  PROFILE —— 只需要改这里的内容，页面会自动渲染 / 自动隐藏空栏目
 * ===================================================================== */
const PROFILE = {
  // 基本信息
  name: "占位姓名",
  englishName: "Your Name",
  avatar: "", // 可填图片 URL/路径，如 "assets/avatar.png"；留空则显示姓名首字
  tagline: "一句话介绍自己 · 例如：后端开发 / C++ / 分布式系统",
  status: "求职意向占位：2026 届 · 后端开发工程师",
  location: "城市占位",

  // 关于我（支持多段）
  summary: [
    "这里是个人简介占位文本。可以写你的技术方向、研究方向、感兴趣的问题，以及你希望展示给访客的第一印象。",
    "第二段占位文本：例如正在学习网络编程 / 数据库 / 操作系统，喜欢用 C++ 造轮子，也关注工程实践与性能优化。"
  ],

  // 联系方式：type 可取 phone / email / school / location / wechat / site，图标自动匹配
  contacts: [
    { type: "phone",    label: "电话",   value: "138-0000-0000", href: "tel:13800000000" },
    { type: "email",    label: "邮箱",   value: "your_name@example.com", href: "mailto:your_name@example.com" },
    { type: "school",   label: "学校",   value: "占位大学 · 计算机科学与技术（本科）" },
    { type: "location", label: "所在地", value: "城市占位" },
    { type: "wechat",   label: "微信",   value: "your_wechat_id" },
    { type: "site",     label: "博客",   value: "blog.csdn.net/your_id", href: "https://blog.csdn.net/your_id" }
  ],

  // 顶部快捷按钮
  actions: [
    { label: "CSDN 博客", href: "https://blog.csdn.net/your_id", icon: "✎" },
    { label: "GitHub",    href: "https://github.com/your_id",    icon: "⌥" },
    { label: "发送邮件",  href: "mailto:your_name@example.com",  icon: "✉", ghost: true }
  ],

  // 技术简介：按分组展示标签。items 可写字符串，或 { name, level } 形式（可扩展进度条）
  skills: [
    { group: "编程语言", items: ["C++ (11/14/17)", "C", "Python", "Go", "Shell"] },
    { group: "后端 / 网络", items: ["Linux 系统编程", "TCP/IP", "多线程 / 并发", "muduo 网络库", "Redis", "MySQL"] },
    { group: "工具 / 工程", items: ["Git", "CMake", "GDB", "Docker", "Makefile"] },
    { group: "方向兴趣", items: ["高性能网络服务", "分布式系统", "性能调优"] }
  ],

  // 个人经历（时间线）：按时间倒序排列
  experiences: [
    {
      period: "2025.06 - 2025.09",
      title: "后端开发实习生（占位）",
      org: "占位科技有限公司",
      desc: "占位描述：参与某某服务的设计与开发，负责某某模块，使用某某技术解决某某问题。",
      tags: ["C++", "Redis", "Linux"]
    },
    {
      period: "2023.09 - 至今",
      title: "计算机科学与技术 · 本科（占位）",
      org: "占位大学",
      desc: "占位描述：主修课程 / GPA / 获奖情况 / 实验室经历等。",
      tags: ["数据结构", "操作系统", "计算机网络"]
    }
  ],

  // 项目经历：link 支持多个
  projects: [
    {
      name: "muduo-http-server（占位）",
      role: "个人项目",
      period: "2025.10 - 至今",
      desc: "基于 muduo 的高性能 HTTP 服务器占位描述。",
      highlights: [
        "占位亮点一：使用 Reactor 模型 + 线程池处理并发连接",
        "占位亮点二：支持静态资源、Keep-Alive、超时连接管理（时间轮）",
        "占位亮点三：压测 QPS 达到 xxxx"
      ],
      tags: ["C++17", "muduo", "epoll"],
      links: [
        { label: "源码", href: "https://github.com/your_id/muduo-http-server" },
        { label: "设计文档", href: "#" }
      ]
    },
    {
      name: "占位项目二",
      role: "课程 / 团队项目",
      period: "2024.03 - 2024.06",
      desc: "一句话占位描述这个项目做了什么。",
      highlights: ["占位亮点：负责的模块与产出。"],
      tags: ["Python", "Flask", "SQLite"],
      links: [{ label: "GitHub", href: "https://github.com/your_id/placeholder" }]
    }
  ],

  // GitHub 仓库（可多个）
  repos: [
    {
      name: "your_id/muduo-http-server",
      desc: "占位描述：基于 muduo 的 HTTP 服务器实现。",
      href: "https://github.com/your_id/muduo-http-server",
      lang: "C++",
      stars: "0",
      forks: "0"
    },
    {
      name: "your_id/placeholder-repo",
      desc: "占位描述：另一个仓库，比如算法题解、工具库或学习笔记。",
      href: "https://github.com/your_id/placeholder-repo",
      lang: "Python",
      stars: "0",
      forks: "0"
    }
  ],

  // 页脚
  footer: {
    text: "感谢访问 · 欢迎交流",
    csdn: "https://blog.csdn.net/your_id",
    github: "https://github.com/your_id"
  }
};

/* =====================================================================
 *  渲染逻辑 —— 一般不需要修改
 * ===================================================================== */
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  const ICONS = { phone: "☎", email: "✉", school: "🎓", location: "📍", wechat: "💬", site: "🔗" };

  // Hero
  $("name").textContent = PROFILE.name || "";
  $("enName").textContent = PROFILE.englishName || "";
  $("tagline").textContent = PROFILE.tagline || "";
  if (PROFILE.status) $("status").textContent = PROFILE.status;
  else $("status").setAttribute("data-empty", "");

  // 头像：有图用图，没有用姓名首字
  if (PROFILE.avatar) {
    $("avatar").innerHTML = '<img src="' + esc(PROFILE.avatar) + '" alt="' + esc(PROFILE.name) + '">';
  } else {
    $("avatar").textContent = (PROFILE.name || "?").trim().charAt(0);
  }

  // 快捷按钮
  $("actions").innerHTML = (PROFILE.actions || []).map((a) =>
    '<a class="btn' + (a.ghost ? " ghost" : "") + '" href="' + esc(a.href) + '"' +
    (a.href && a.href.startsWith("http") ? ' target="_blank" rel="noopener"' : "") + '>' +
    (a.icon ? esc(a.icon) + " " : "") + esc(a.label) + '</a>'
  ).join("");

  // 关于我
  $("summary").innerHTML = (PROFILE.summary || []).map((p) => "<p>" + esc(p) + "</p>").join("");
  toggle("sec-about", (PROFILE.summary || []).length);

  // 联系方式
  $("contacts").innerHTML = (PROFILE.contacts || []).map((c) => {
    const val = c.href
      ? '<a href="' + esc(c.href) + '"' + (c.href.startsWith("http") ? ' target="_blank" rel="noopener"' : "") + '>' + esc(c.value) + "</a>"
      : esc(c.value);
    return '<div class="contact-item"><div class="ico">' + (c.icon || ICONS[c.type] || "•") + "</div>" +
      '<div><div class="k">' + esc(c.label) + '</div><div class="v">' + val + "</div></div></div>";
  }).join("");
  toggle("sec-contact", (PROFILE.contacts || []).length);

  // 技术简介
  $("skills").innerHTML = (PROFILE.skills || []).map((g) =>
    '<div class="card skill-group"><h3>' + esc(g.group) + '</h3><div class="tags">' +
    (g.items || []).map((it) => {
      const name = typeof it === "string" ? it : it.name;
      return '<span class="tag">' + esc(name) + "</span>";
    }).join("") + "</div></div>"
  ).join("");
  toggle("sec-skills", (PROFILE.skills || []).length);

  // 个人经历
  $("timeline").innerHTML = (PROFILE.experiences || []).map((e) =>
    '<div class="tl-item"><div class="tl-period">' + esc(e.period) + "</div>" +
    '<div class="tl-title">' + esc(e.title) +
    (e.org ? ' <span class="org">· ' + esc(e.org) + "</span>" : "") + "</div>" +
    (e.desc ? '<p class="tl-desc">' + esc(e.desc) + "</p>" : "") +
    tagsHtml(e.tags) + "</div>"
  ).join("");
  toggle("sec-exp", (PROFILE.experiences || []).length);

  // 项目经历
  $("projects").innerHTML = (PROFILE.projects || []).map((p) =>
    '<div class="card item"><div class="item-top"><div class="item-title">' +
    (p.href ? '<a href="' + esc(p.href) + '" target="_blank" rel="noopener">' + esc(p.name) + "</a>" : esc(p.name)) +
    '</div><div class="item-role">' + esc(p.role || "") + "</div></div>" +
    (p.period ? '<div class="item-role">' + esc(p.period) + "</div>" : "") +
    (p.desc ? '<p class="item-desc">' + esc(p.desc) + "</p>" : "") +
    ((p.highlights || []).length ? "<ul>" + p.highlights.map((h) => "<li>" + esc(h) + "</li>").join("") + "</ul>" : "") +
    tagsHtml(p.tags) + linksHtml(p.links) + "</div>"
  ).join("");
  toggle("sec-projects", (PROFILE.projects || []).length);

  // 开源仓库
  $("repos").innerHTML = (PROFILE.repos || []).map((r) =>
    '<div class="card item"><div class="item-title"><a href="' + esc(r.href) + '" target="_blank" rel="noopener">' +
    esc(r.name) + "</a></div>" +
    '<p class="item-desc">' + esc(r.desc) + "</p>" +
    '<div class="meta">' + (r.lang ? "<span>● " + esc(r.lang) + "</span>" : "") +
    (r.stars != null ? "<span>★ " + esc(r.stars) + "</span>" : "") +
    (r.forks != null ? "<span>⑂ " + esc(r.forks) + "</span>" : "") + "</div></div>"
  ).join("");
  toggle("sec-repos", (PROFILE.repos || []).length);

  // 页脚
  const f = PROFILE.footer || {};
  $("footer").innerHTML = (f.text ? esc(f.text) : "") +
    (f.csdn ? '<span class="sep">·</span><a href="' + esc(f.csdn) + '" target="_blank" rel="noopener">CSDN</a>' : "") +
    (f.github ? '<span class="sep">·</span><a href="' + esc(f.github) + '" target="_blank" rel="noopener">GitHub</a>' : "");

  // 小工具
  function tagsHtml(tags) {
    return (tags || []).length
      ? '<div class="tags">' + tags.map((t) => '<span class="tag plain">' + esc(t) + "</span>").join("") + "</div>"
      : "";
  }
  function linksHtml(links) {
    return (links || []).length
      ? '<div class="links">' + links.map((l) =>
          '<a href="' + esc(l.href) + '"' + (String(l.href).startsWith("http") ? ' target="_blank" rel="noopener"' : "") + ">" + esc(l.label) + " →</a>"
        ).join("") + "</div>"
      : "";
  }
  function toggle(id, hasContent) {
    if (!hasContent) $(id).setAttribute("data-empty", "");
  }
})();
</script>
</body>
</html>
